name: Changelog

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require CHANGELOG.md in this pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          if ! git diff --name-only "$BASE" HEAD | grep -qx 'CHANGELOG.md'; then
            echo 'Every pull request must update CHANGELOG.md'
            git diff --name-only "$BASE" HEAD
            exit 1
          fi
